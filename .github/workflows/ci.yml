name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings (max line length 120)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Check for syntax errors
      run: python -m py_compile ChatCompletionAPI/script.py

    - name: Verify imports
      run: python -c "import openai; print('OpenAI SDK available:', openai.__version__)"
      env:
        OPENAI_API_KEY: "test-key-for-import-check"
